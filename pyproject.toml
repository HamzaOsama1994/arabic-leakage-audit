[project]
name = "leakaudit"
version = "1.0.0"
description = "Evidence-level leakage audit, leakage-safe splits and selective routing for Arabic claim verification"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pandas==3.0.1", "scikit-learn==1.8.0", "numpy==2.4.2", "scipy==1.17.1", "torch==2.11.0",
                "transformers==5.5.0", "sentence-transformers==5.5.1"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
